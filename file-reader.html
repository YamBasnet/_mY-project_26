<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local File Reader</title>
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#1c2321;--mute:#66726e;--line:#d8dfdc;--accent:#0f6b5c;--accent-ink:#fff;--hl:#fff3b0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a18;--panel:#1c2421;--ink:#e6ece9;--mute:#8e9c97;--line:#2e3a36;--accent:#4cc2aa;--accent-ink:#0c1a16;--hl:#5a4d00}}
:root[data-theme=dark]{--bg:#141a18;--panel:#1c2421;--ink:#e6ece9;--mute:#8e9c97;--line:#2e3a36;--accent:#4cc2aa;--accent-ink:#0c1a16;--hl:#5a4d00}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:9}
@media print{header,#tabs,.bar,.toast{display:none}body{display:block;height:auto}main{overflow:visible}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
button,label.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
button.primary,label.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
#tabs{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;color:var(--mute);background:var(--bg)}
.addtab{padding:2px 12px;font-size:18px;line-height:1.2;border-radius:6px 6px 0 0;border-bottom:none;position:sticky;right:0;flex:none}
.tab.on{background:var(--bg);color:var(--ink);border-color:var(--accent);font-weight:600}
.tab b{font-weight:400;opacity:.7;padding:0 2px}
.bar{display:flex;gap:8px;align-items:center;padding:8px 16px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.bar .grow{flex:1}
main{flex:1;min-height:0;overflow:auto;padding:0 16px 16px;position:relative;display:flex;flex-direction:column}
*{scrollbar-width:auto;scrollbar-color:var(--mute) var(--bg)}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-thumb{background:var(--mute);border-radius:8px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:var(--bg)}
#favp{position:fixed;top:56px;left:16px;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:calc(100vw - 32px);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.fr{display:flex;gap:10px;align-items:center;padding:4px 0;flex-wrap:wrap}
#nav{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:6px;z-index:5}
#nav button{box-shadow:0 1px 4px rgba(0,0,0,.25);padding:6px 10px}
#drop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;min-height:260px;border:2px dashed var(--line);border-radius:12px;margin-top:16px;color:var(--mute);text-align:center;padding:20px}
#drop.over,body.over #drop{border-color:var(--accent);color:var(--ink)}
#drop big{font-size:22px;color:var(--ink);font-weight:600}
pre.txt{flex:1;min-height:0;margin:0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font:13px/1.55 ui-monospace,Consolas,Menlo,monospace;white-space:pre;overflow:auto;tab-size:4}
pre.txt.wrap{white-space:pre-wrap;word-break:break-word}
.doc{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 22px;max-width:80ch;margin:0 auto}
.doc h1,.doc h2,.doc h3{margin:1em 0 .4em}
.doc pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto}
.doc code{background:var(--bg);padding:1px 4px;border-radius:4px}
.doc li{margin-left:1.2em;display:list-item}
.doc a{color:var(--accent)}
.tw{border:1px solid var(--line);border-radius:8px;overflow:auto;flex:1;min-height:0;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none;z-index:1}
th:hover{color:var(--accent)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 60%,transparent)}
mark{background:var(--hl);color:inherit}
iframe,embed{flex:1;width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;background:#fff}
img,video{border-radius:8px;display:block;margin:0 auto}
img.fit{flex:1;min-height:0;width:100%;object-fit:contain}
img:not(.fit){flex:none;max-width:none;margin:0}
video{flex:1;min-height:0;width:100%;object-fit:contain}
audio{width:100%;flex:none}
</style>
</head>
<body>
<header>
  <h1>Local File Reader</h1>
  <button class="primary" id="bOpen">Open</button>
  <button id="bRefresh" title="Reload the current file from disk">Refresh</button>
  <button id="bPin" title="Pin this file as a favorite">☆ Pin</button>
  <button id="bFav">Favorites</button>
  <button id="bClose" title="Close current file">Close</button>
  <button id="bCloseAll">Close all</button>
  <button id="bSave" title="Download a copy">Save copy</button>
  <button id="bPrint">Print</button>
  <button id="bZm" title="Smaller text">A−</button>
  <button id="bZp" title="Larger text">A+</button>
  <button id="bTheme" title="Switch theme">Theme: auto</button>
  <button id="bFull">Fullscreen</button>
  <input id="pick" type="file" multiple hidden>
</header>
<div id="tabs" hidden></div>
<div class="bar" id="bar" hidden></div>
<main id="main">
  <div id="drop">
    <big>Drop files here</big>
    <span>Reads CSV, TSV, TXT, Markdown, JSON, HTML, XML, logs, code, images, PDF, audio and video.<br>Everything stays on your computer. Nothing is uploaded.</span>
  </div>
</main>
<div id="favp" hidden></div>
<div id="nav" hidden>
  <button id="nTop" title="Go to top (Home)">Top</button>
  <button id="nUp" title="Page up (PgUp)">Up</button>
  <button id="nDn" title="Page down (PgDn)">Down</button>
  <button id="nEnd" title="Go to bottom (End)">Bottom</button>
</div>
<script>
const $=s=>document.querySelector(s);
const main=$('#main'),tabs=$('#tabs'),bar=$('#bar');
let files=[],cur=-1,wrap=false;const favs=new Map();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const size=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const IMG=['png','jpg','jpeg','gif','webp','svg','bmp','ico','avif'],AUD=['mp3','wav','ogg','m4a','flac','aac'],VID=['mp4','webm','mov','m4v','ogv'];

function add(list){
  const n=files.length;
  for(const it of list){const f=it.f||it;files.push({f,h:it.h||null,name:f.name,e:ext(f.name),url:URL.createObjectURL(f),text:null});}
  if(list.length)show(n);
}
function show(i){cur=i;drawTabs();render();}
function drawTabs(){
  tabs.hidden=false;
  document.getElementById('nav').hidden=!files.length;
  ['bClose','bCloseAll','bRefresh','bSave','bPrint','bPin'].forEach(id=>document.getElementById(id).disabled=!files.length);
  document.getElementById('bPin').textContent=(files[cur]&&favs.has(files[cur].name))?'★ Pinned':'☆ Pin';
  tabs.innerHTML='';
  files.forEach((x,i)=>{
    const t=document.createElement('div');t.className='tab'+(i===cur?' on':'');t.tabIndex=0;
    t.innerHTML=esc(x.name)+' <b title="Close" role="button">×</b>';
    t.onclick=ev=>{if(ev.target.tagName==='B')close(i);else show(i)};
    t.onkeydown=ev=>{if(ev.key==='Enter')show(i)};
    t.onauxclick=ev=>{if(ev.button===1){ev.preventDefault();close(i)}};
    tabs.appendChild(t);
  });
  const p=document.createElement('button');p.className='addtab';p.textContent='+';p.title='Open more files in new tabs';p.onclick=openDlg;
  tabs.appendChild(p);
}
function close(i){
  URL.revokeObjectURL(files[i].url);files.splice(i,1);
  if(!files.length){cur=-1;drawTabs();bar.hidden=true;main.innerHTML=emptyHTML();return;}
  show(Math.min(i,files.length-1));
}
function emptyHTML(){return '<div id="drop"><big>Drop files here</big><span>Open another file to keep reading.</span></div>'}

async function getText(x){if(x.text===null)x.text=await x.f.text();return x.text;}
function setBar(x,extra){
  bar.hidden=false;bar.innerHTML='<span>'+esc(x.name)+' · '+size(x.f.size)+'</span><span class="grow"></span>';
  (extra||[]).forEach(el=>bar.appendChild(el));
}
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b;}

async function render(){
  const x=files[cur];if(!x)return;
  main.innerHTML='';
  const e=x.e;
  if(IMG.includes(e)){let fit=true;const im=document.createElement('img');im.alt='';im.src=x.url;im.className='fit';const fb=btn('Fit: window',()=>{fit=!fit;im.className=fit?'fit':'';fb.textContent=fit?'Fit: window':'Fit: actual size'});setBar(x,[fb]);main.appendChild(im);}
  else if(AUD.includes(e)){setBar(x);main.innerHTML='<audio controls></audio>';main.firstChild.src=x.url;}
  else if(VID.includes(e)){setBar(x);main.innerHTML='<video controls></video>';main.firstChild.src=x.url;}
  else if(e==='pdf'){setBar(x);main.innerHTML='<embed type="application/pdf">';main.firstChild.src=x.url;}
  else if(['csv','tsv'].includes(e)){tableView(x,await getText(x));}
  else if(['html','htm'].includes(e)){htmlView(x,await getText(x));}
  else if(['md','markdown'].includes(e)){mdView(x,await getText(x));}
  else if(e==='json'){const t=await getText(x);let out=t;try{out=JSON.stringify(JSON.parse(t),null,2)}catch(_){}textView(x,out);}
  else{textView(x,await getText(x));}
}

function textView(x,t){
  const w=btn(wrap?'No wrap':'Wrap lines',()=>{wrap=!wrap;render()});
  const c=btn('Copy',()=>{navigator.clipboard.writeText(t).then(()=>{c.textContent='Copied'})});
  const q=document.createElement('input');q.type='search';q.placeholder='Find in file';
  const lines=t.split('\n').length;
  const g=document.createElement('input');g.type='number';g.min=1;g.placeholder='Go to line';g.style.width='110px';setBar(x,[q,g,w,c]);
  const s=document.createElement('span');s.textContent=lines.toLocaleString()+' lines';bar.insertBefore(s,bar.children[1]);
  const pre=document.createElement('pre');pre.className='txt'+(wrap?' wrap':'');pre.textContent=t;main.appendChild(pre);
  g.onchange=()=>{const n=+g.value;if(n>0)pre.scrollTop=(n-1)*parseFloat(getComputedStyle(pre).lineHeight);};
  q.oninput=()=>{
    if(!q.value){pre.textContent=t;return;}
    const re=new RegExp(q.value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    pre.innerHTML=esc(t).replace(new RegExp(esc(q.value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>');
  };
}

function mdView(x,t){
  let mode='read';
  const tog=btn('View source',()=>{mode=mode==='read'?'src':'read';tog.textContent=mode==='read'?'View source':'View formatted';draw()});
  setBar(x,[tog]);
  const draw=()=>{
    main.innerHTML='';
    if(mode==='src'){const p=document.createElement('pre');p.className='txt wrap';p.textContent=t;main.appendChild(p);return;}
    let s=esc(t);
    s=s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c+'</pre>')
      .replace(/^(#{1,6}) (.*)$/gm,(m,h,v)=>'<h'+h.length+'>'+v+'</h'+h.length+'>')
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/\n{2,}/g,'<br><br>');
    const d=document.createElement('div');d.className='doc';d.innerHTML=s;main.appendChild(d);
  };
  draw();
}

function htmlView(x,t){
  let mode='prev',scripts=false;
  const a=btn('View source',()=>{mode=mode==='prev'?'src':'prev';a.textContent=mode==='prev'?'View source':'Preview';draw()});
  const b=btn('Run scripts: off',()=>{scripts=!scripts;b.textContent='Run scripts: '+(scripts?'on':'off');draw()});
  setBar(x,[b,a]);
  const draw=()=>{
    main.innerHTML='';
    if(mode==='src'){const p=document.createElement('pre');p.className='txt wrap';p.textContent=t;main.appendChild(p);return;}
    const f=document.createElement('iframe');f.sandbox=scripts?'allow-scripts':'';f.srcdoc=t;main.appendChild(f);
  };
  draw();
}

function parseCSV(t,d){
  const r=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'){row.push(f);r.push(row);row=[];f=''}
    else if(c!=='\r')f+=c;
  }
  if(f||row.length){row.push(f);r.push(row)}
  return r;
}
function tableView(x,t){
  const first=t.split('\n')[0]||'';
  const d=x.e==='tsv'?'\t':[',',';','\t','|'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=parseCSV(t,d);
  if(!rows.length){textView(x,t);return;}
  const head=rows[0],body=rows.slice(1);
  let sortCol=-1,asc=true;
  const q=document.createElement('input');q.type='search';q.placeholder='Filter rows';
  const cnt=document.createElement('span');
  const dl=btn('Download as TSV',()=>{
    const s=rows.map(r=>r.join('\t')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/tab-separated-values'}));a.download=x.name.replace(/\.\w+$/,'')+'.tsv';a.click();
  });
  let lim=body.length>50000?5000:Infinity;
  const sel=document.createElement('select');sel.title='Rows to show';
  [['1000','1,000 rows'],['5000','5,000 rows'],['20000','20,000 rows'],['all','All rows']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o)});
  sel.value=lim===Infinity?'all':'5000';sel.style.cssText='font:inherit;padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)';
  sel.onchange=()=>{lim=sel.value==='all'?Infinity:+sel.value;draw()};
  setBar(x,[q,sel,dl]);bar.insertBefore(cnt,bar.children[1]);
  const wrapEl=document.createElement('div');wrapEl.className='tw';main.appendChild(wrapEl);
  const isNum=v=>v!==''&&!isNaN(v.replace(/[,$%\s]/g,''));
  const draw=()=>{
    const f=q.value.toLowerCase();
    let data=f?body.filter(r=>r.some(c=>c.toLowerCase().includes(f))):body.slice();
    if(sortCol>=0)data.sort((a,b)=>{
      const u=a[sortCol]||'',v=b[sortCol]||'';
      const r=isNum(u)&&isNum(v)?parseFloat(u.replace(/[,$%\s]/g,''))-parseFloat(v.replace(/[,$%\s]/g,'')):u.localeCompare(v);
      return asc?r:-r;
    });
    cnt.textContent=data.length.toLocaleString()+' of '+body.length.toLocaleString()+' rows'+(data.length>lim?' (showing '+lim.toLocaleString()+')':'');
    const shown=data.slice(0,lim);
    let h='<table><thead><tr>'+head.map((c,i)=>'<th data-i="'+i+'">'+esc(c)+(i===sortCol?(asc?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>';
    h+=shown.map(r=>'<tr>'+head.map((_,i)=>{const v=r[i]||'';return '<td'+(isNum(v)?' class="n"':'')+' title="'+esc(v)+'">'+esc(v)+'</td>'}).join('')+'</tr>').join('');
    wrapEl.innerHTML=h+'</tbody></table>';
    wrapEl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;if(sortCol===i)asc=!asc;else{sortCol=i;asc=true}draw()});
  };
  q.oninput=draw;draw();
}

let z=1,themes=['auto','light','dark'],ti=0;
function flash(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
async function openDlg(){
  if(window.showOpenFilePicker){
    try{const hs=await showOpenFilePicker({multiple:true});const L=[];for(const h of hs)L.push({f:await h.getFile(),h});add(L);}
    catch(e){if(e.name!=='AbortError')$('#pick').click();}
  }else $('#pick').click();
}
async function refresh(){
  const x=files[cur];if(!x)return;
  try{
    if(x.h)x.f=await x.h.getFile();
    await x.f.slice(0,1).arrayBuffer();
    URL.revokeObjectURL(x.url);x.url=URL.createObjectURL(x.f);x.text=null;
    await render();flash('Refreshed '+x.name);
  }catch(_){flash('The file changed on disk. Open it again to refresh.');}
}
function zoom(d){z=Math.min(2.5,Math.max(.6,z+d));main.style.zoom=z;flash(Math.round(z*100)+'%');}
$('#bOpen').onclick=openDlg;
$('#bRefresh').onclick=refresh;
$('#bClose').onclick=()=>close(cur);
$('#bCloseAll').onclick=()=>{while(files.length)close(0);};
$('#bSave').onclick=()=>{const x=files[cur];if(!x)return;const a=document.createElement('a');a.href=x.url;a.download=x.name;a.click();};
$('#bPrint').onclick=()=>window.print();
$('#bZm').onclick=()=>zoom(-.1);
$('#bZp').onclick=()=>zoom(.1);
$('#bTheme').onclick=e=>{ti=(ti+1)%3;const t=themes[ti];if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;e.target.textContent='Theme: '+t;};
$('#bFull').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='o'){e.preventDefault();openDlg();}});
drawTabs();
const DB=()=>new Promise((ok,no)=>{const r=indexedDB.open('lfr',1);r.onupgradeneeded=()=>r.result.createObjectStore('fav',{keyPath:'name'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});
async function dbAll(){const d=await DB();return new Promise(ok=>{const q=d.transaction('fav').objectStore('fav').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>ok([]);});}
async function dbPut(v){const d=await DB();return new Promise(ok=>{const t=d.transaction('fav','readwrite');t.objectStore('fav').put(v);t.oncomplete=ok;t.onerror=ok;});}
async function dbDel(k){const d=await DB();return new Promise(ok=>{const t=d.transaction('fav','readwrite');t.objectStore('fav').delete(k);t.oncomplete=ok;t.onerror=ok;});}
async function openFav(v,quiet){
  try{
    const ex=files.findIndex(a=>a.name===v.name);if(ex>=0){show(ex);return;}
    if(!quiet&&await v.handle.requestPermission({mode:'read'})!=='granted'){flash('Permission was not given');return;}
    add([{f:await v.handle.getFile(),h:v.handle}]);
  }catch(_){flash(v.name+' was moved or deleted');}
}
async function pin(){
  const x=files[cur];if(!x)return;
  if(favs.has(x.name)){favs.delete(x.name);await dbDel(x.name);flash('Unpinned');}
  else{
    if(!x.h){flash('Use the Open button in Chrome or Edge to pin this file');return;}
    const v={name:x.name,handle:x.h,auto:false};favs.set(x.name,v);await dbPut(v);flash('Pinned. Turn on Auto-open in Favorites.');
  }
  drawTabs();
}
function favPanel(){
  const p=$('#favp');p.hidden=!p.hidden;if(p.hidden)return;
  p.innerHTML='';
  if(!favs.size){p.textContent='No pinned files yet. Open a file and click Pin.';return;}
  favs.forEach(v=>{
    const r=document.createElement('div');r.className='fr';
    const n=document.createElement('span');n.textContent=v.name;n.style.flex='1';
    const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!v.auto;c.onchange=()=>{v.auto=c.checked;dbPut(v);};l.append(c,' Auto-open');
    const o=btn('Open',()=>{openFav(v);p.hidden=true;});
    const d=btn('Remove',async()=>{favs.delete(v.name);await dbDel(v.name);drawTabs();favPanel();favPanel();});
    r.append(n,l,o,d);p.appendChild(r);
  });
}
$('#bPin').onclick=pin;$('#bFav').onclick=favPanel;
async function init(){
  try{(await dbAll()).forEach(v=>favs.set(v.name,v));}catch(_){return;}
  drawTabs();
  const pend=[];
  for(const v of favs.values()){
    if(!v.auto)continue;
    try{if(await v.handle.queryPermission({mode:'read'})==='granted')await openFav(v,true);else pend.push(v);}catch(_){}
  }
  if(pend.length){
    const t=document.createElement('div');t.className='toast';
    const b=btn('Restore '+pend.length+' pinned file'+(pend.length>1?'s':''),async()=>{t.remove();await Promise.all(pend.map(v=>openFav(v)));});
    t.appendChild(b);document.body.appendChild(t);
  }
}
init();
function scroller(){return main.querySelector('.tw,pre.txt')||main;}
function go(w){const s=scroller(),h=s.clientHeight*.9;if(w==='top')s.scrollTo({top:0});else if(w==='end')s.scrollTo({top:s.scrollHeight});else s.scrollBy({top:w==='up'?-h:h});}
$('#nTop').onclick=()=>go('top');$('#nUp').onclick=()=>go('up');$('#nDn').onclick=()=>go('down');$('#nEnd').onclick=()=>go('end');
addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||!files.length)return;
  const m={Home:'top',End:'end',PageUp:'up',PageDown:'down'}[e.key];
  if(m){e.preventDefault();go(m);}
});
$('#pick').onchange=e=>{add([...e.target.files]);e.target.value='';};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('over')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('over')});
addEventListener('drop',async e=>{
  e.preventDefault();document.body.classList.remove('over');
  const items=[...e.dataTransfer.items].filter(i=>i.kind==='file');
  const hs=items.map(i=>i.getAsFileSystemHandle?i.getAsFileSystemHandle().catch(()=>null):Promise.resolve(null));
  const fs=items.map(i=>i.getAsFile());
  const H=await Promise.all(hs);
  add(fs.map((f,i)=>({f,h:H[i]&&H[i].kind==='file'?H[i]:null})).filter(o=>o.f));
});
</script>
</body>
